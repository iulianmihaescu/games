<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Vladimir's World Game</title>
  <meta name="description" content="Joc pentru copii: găsește țările și capitalele pe harta lumii.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ ECRAN PRINCIPAL ============ -->
  <section id="screen-home" class="screen home">
    <div class="home-inner">
      <div class="globe" aria-hidden="true">🌍</div>
      <h1 class="title">Vladimir's<br><span>World Game</span></h1>
      <p class="subtitle">Hai să descoperim țările și capitalele lumii!</p>
      <div class="total-stars" id="total-stars">⭐ 0</div>

      <div class="mode-grid">
        <button class="mode-btn find" data-mode="find">
          <span class="mode-emoji">🔍</span>
          <span class="mode-name">Găsește țara</span>
          <span class="mode-desc">Caută țara pe hartă</span>
        </button>
        <button class="mode-btn capitals" data-mode="capitals">
          <span class="mode-emoji">🏰</span>
          <span class="mode-name">Capitale</span>
          <span class="mode-desc">Alege capitala corectă</span>
        </button>
        <button class="mode-btn explore" data-mode="explore">
          <span class="mode-emoji">🧭</span>
          <span class="mode-name">Explorează</span>
          <span class="mode-desc">Atinge orice țară</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ ALEGE REGIUNEA ============ -->
  <section id="screen-setup" class="screen setup" hidden>
    <div class="setup-inner">
      <button class="back-btn" id="setup-back" aria-label="Înapoi">⬅️</button>
      <h2 id="setup-title">Unde vrei să joci?</h2>
      <div class="region-grid" id="region-grid"></div>
      <h3>Cât de greu?</h3>
      <div class="level-row" id="level-row">
        <button class="level-btn" data-level="1">⭐<span>Ușor</span></button>
        <button class="level-btn" data-level="2">⭐⭐<span>Mediu</span></button>
        <button class="level-btn" data-level="3">⭐⭐⭐<span>Greu</span></button>
      </div>
      <button class="play-btn" id="play-btn">Joacă! 🚀</button>
    </div>
  </section>

  <!-- ============ JOCUL ============ -->
  <section id="screen-game" class="screen game" hidden>
    <header class="topbar">
      <button class="icon-btn" id="home-btn" aria-label="Meniu">🏠</button>
      <div class="progress" id="progress"></div>
      <div class="score" id="score">⭐ 0</div>
      <button class="icon-btn" id="sound-btn" aria-label="Sunet">🔊</button>
    </header>

    <div class="prompt" id="prompt">
      <div class="flag" id="prompt-flag"></div>
      <div class="prompt-text">
        <div class="prompt-small" id="prompt-small"></div>
        <div class="prompt-big" id="prompt-big"></div>
        <div class="prompt-extra" id="prompt-extra"></div>
      </div>
      <button class="icon-btn speak-btn" id="speak-btn" aria-label="Citește din nou">🗣️</button>
      <button class="next-btn" id="next-btn" hidden>Mai departe ➡️</button>
    </div>

    <div class="answers" id="answers" hidden></div>

    <div class="map-wrap" id="map-wrap">
      <svg id="map" role="img" aria-label="Harta lumii"></svg>
      <div class="map-controls">
        <button class="icon-btn" id="zoom-in" aria-label="Mărește">➕</button>
        <button class="icon-btn" id="zoom-out" aria-label="Micșorează">➖</button>
        <button class="icon-btn" id="zoom-reset" aria-label="Toată harta">🌍</button>
        <button class="icon-btn hint-btn" id="hint-btn" aria-label="Ajutor">💡</button>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
  </section>

  <!-- ============ SFÂRȘIT DE RUNDĂ ============ -->
  <div class="overlay" id="end-overlay" hidden>
    <div class="end-card">
      <div class="trophy" id="end-trophy">🏆</div>
      <h2 id="end-title">Bravo, Vladimir!</h2>
      <p id="end-text"></p>
      <div class="end-stars" id="end-stars"></div>
      <div class="end-buttons">
        <button class="play-btn" id="again-btn">Încă o dată 🔁</button>
        <button class="play-btn secondary" id="menu-btn">Meniu 🏠</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="data/world-110m.js"></script>
  <script src="data/countries.js"></script>
  <script src="game.js"></script>
</body>
</html>
